name: Refresh profile README

on:
  schedule:
    # Every 3 hours; a merged upstream PR shows up on the page within one run.
    - cron: 17 */3 * * *
  workflow_dispatch:
  push:
    paths:
      - scripts/build_readme.py
      - .github/workflows/refresh.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild README.md from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_readme.py --write

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh merged pull request record"
          git push
